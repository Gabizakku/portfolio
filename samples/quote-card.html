<!doctype html>
<html><head><meta charset="utf-8"><style>
  @page{margin:0}
  html,body{margin:0;padding:0}
  .card{width:1080px;height:1080px;background:#f6f1e7;position:relative;overflow:hidden;
    font-family:Georgia,'Iowan Old Style',serif;color:#241f1a}
  .grain{position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(#d8cfbe 0.7px,transparent 0.7px);background-size:7px 7px}
  .frame{position:absolute;inset:54px;border:1px solid #cdbfa5}
  .inner{position:absolute;inset:54px;padding:88px 86px;display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font:600 17px/1 "Segoe UI",Helvetica,sans-serif;letter-spacing:.34em;
    text-transform:uppercase;color:#8a6f45}
  .mark{font-size:96px;line-height:.7;color:#c2a878;margin:0}
  blockquote{margin:0;font-size:63px;line-height:1.2;letter-spacing:-1.1px}
  blockquote em{font-style:italic;color:#6b5330}
  .who{display:flex;align-items:center;gap:22px;margin-top:44px}
  .rule{flex:0 0 74px;height:1px;background:#a08a63}
  .name{font:600 21px/1.3 "Segoe UI",Helvetica,sans-serif;letter-spacing:.06em;color:#3a3128}
  .name span{display:block;font:400 15px/1.4 "Segoe UI",sans-serif;color:#8a7d68;letter-spacing:.02em;margin-top:5px}
  .corner{position:absolute;right:86px;bottom:74px;font:500 13px/1 "Segoe UI",sans-serif;
    letter-spacing:.22em;text-transform:uppercase;color:#b3a184}
</style></head>
<body>
<div class="card">
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="kicker">Reading notes</div>
    <div>
      <p class="mark">&ldquo;</p>
      <blockquote>Write the sentence you are afraid of first. <em>Everything after it comes easier.</em></blockquote>
      <div class="who">
        <div class="rule"></div>
        <div class="name">Sample graphic<span>1080 × 1080 · quote card · brand-safe palette</span></div>
      </div>
    </div>
    <div></div>
  </div>
  <div class="corner">demo</div>
</div>
</body></html>
